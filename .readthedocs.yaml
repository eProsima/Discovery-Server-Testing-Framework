# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    # Required by pyenchant, used by sphinxcontrib.spelling
    - libenchant-2-2

# Build the documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Build the documentation in additional formats besides HTML
formats: all

# Python requirements required to build the documentation
python:
  install:
    - requirements: docs/requirements.txt
